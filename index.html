<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>Kártya</title>
<style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #fff; font-family: sans-serif; }
    .element { position: absolute; transform: translate(-50%, -50%); pointer-events: none; }
    .txt { max-width: 92vw; text-align: center; line-height: 1.1; white-space: pre-wrap; text-shadow: 0 0 8px #000; }
    .img img { width: 100%; height: 100%; object-fit: contain; display: block; }
    #v-cont { display: none; } #v-cont iframe { width: 100%; height: 100%; border: 0; }
    #v-cont.yt { min-width: 200px; min-height: 200px; }   /* YouTube: a lejátszó legalább 200x200 px */
    #v-cont.ctl { pointer-events: auto; }
    #fx { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
    body.edit .element { outline: 1px dashed rgba(0,255,0,.55); }
    body.edit:not(.ro) .element[data-k] { pointer-events: auto; cursor: move; touch-action: none; }
    body.edit #v-cont iframe, body.edit #v-cont video { pointer-events: none; }
    #sel { position: fixed; z-index: 200; border: 1.5px solid #0af; box-sizing: border-box; pointer-events: none; }
    #sel[hidden] { display: none; }
    #sel i { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; background: #fff; border: 2px solid #0af; border-radius: 50%; pointer-events: auto; touch-action: none; }
    #sel i[data-h=nw] { left: 0; top: 0; cursor: nwse-resize; } #sel i[data-h=n] { left: 50%; top: 0; cursor: ns-resize; }
    #sel i[data-h=ne] { left: 100%; top: 0; cursor: nesw-resize; } #sel i[data-h=e] { left: 100%; top: 50%; cursor: ew-resize; }
    #sel i[data-h=se] { left: 100%; top: 100%; cursor: nwse-resize; } #sel i[data-h=s] { left: 50%; top: 100%; cursor: ns-resize; }
    #sel i[data-h=sw] { left: 0; top: 100%; cursor: nesw-resize; } #sel i[data-h=w] { left: 0; top: 50%; cursor: ew-resize; }
    #rot { position: absolute; left: 50%; top: -34px; width: 16px; height: 16px; margin-left: -8px; background: #0af; border-radius: 50%; cursor: grab; pointer-events: auto; touch-action: none; }
    #rot::after { content: ''; position: absolute; left: 7px; top: 16px; width: 2px; height: 18px; background: #0af; }
    #start { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.55); }
    #go { font: 700 1.1rem 'Orbitron', sans-serif; padding: 16px 34px; color: #0f0; background: #000; border: 2px solid #0f0; border-radius: 8px; cursor: pointer; }
    #go:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
</style>
</head>
<body>
<div id="layer"></div>
<div id="v-cont" class="element" data-k="v"><div id="player"></div></div>
<div id="sel" hidden></div>
<canvas id="fx"></canvas>
<div id="start"><div style="text-align:center"><button id="go" type="button">Indítás</button><p id="note" style="max-width:300px;margin:14px auto 0;font-size:.7rem;color:#aaa"></p></div></div>

<script type="module">
import { URLHandler as U } from './url-handler.js';
import { TransformModule as T } from './transform-module.js';
import { loadLang, t } from './i18n.js';

const $ = id => document.getElementById(id);
const EMB = parent !== window;                                       // az admin előnézetében fut-e
const THUMB = new URLSearchParams(location.search).get('thumb') === '1';
const isSlave = () => EMB && innerWidth > innerHeight;              // a fekvő előnézet néma követő
const layer = $('layer'), ov = $('start'), go = $('go'), cv = $('fx');
const els = new Map(), fonts = new Set();
let last = Object.fromEntries(new URLSearchParams(location.search));
let player = null, media = { key: '' }, fileEl = null, started = false, fxKey = '', raf = 0;

function loadFont(f) {                       // csak engedélyezett betűtípus kerülhet ide
    if (!f || fonts.has(f)) return;
    fonts.add(f);
    const l = document.createElement('link');
    l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=' + f.replace(/ /g, '+') + '&display=swap';
    document.head.appendChild(l);
}

function render(p) {
    last = p;
    const seen = new Set(), land = innerWidth > innerHeight;
    const pk = k => (land && p['l' + k] != null && p['l' + k] !== '') ? p['l' + k] : p[k];
    const put = (id, cls) => {
        let el = els.get(id);
        if (!el) { el = document.createElement('div'); el.id = id; layer.appendChild(el); els.set(id, el); }
        el.className = 'element ' + cls; seen.add(id); return el;
    };
    const text = (id, t, c, f, s, x, y, dy, z, r) => {
        if (!t) return;
        const el = put(id, 'txt'), font = U.font(f);
        loadFont(font);
        el.textContent = String(t).slice(0, 300);          // csak textContent: nincs HTML-injektálás
        Object.assign(el.style, {
            left: U.num(x, -50, 150, 50) + '%', top: U.num(y, -50, 150, dy) + '%',
            zIndex: U.num(z, 0, 99, 20), transform: `translate(-50%,-50%) rotate(${U.num(r, -360, 360, 0)}deg)`, color: U.hex(c) || '#fff', fontSize: U.num(s, 1, 30, 5) + 'vmin',
            fontFamily: font ? `"${font}", sans-serif` : 'sans-serif'
        });
    };

    text('t-m', p.cim, p.mc, p.mf, p.ms, pk('mx'), pk('my'), 10, p.mz);
    text('t-s', p.alcim, p.sc, p.sf, p.ss, pk('sx'), pk('sy'), 20, p.sz);

    for (const k of Object.keys(p)) {
        let m = k.match(/^txt(\d{1,2})$/);                  // szabad szövegek: txtN, fN, cN, sN, xN, yN
        if (m) { const n = m[1]; text('t-' + n, p[k], p['c' + n], p['f' + n], p['s' + n], pk('x' + n), pk('y' + n), 50, p['z' + n], p['r' + n]); const te = els.get('t-' + n); if (te) te.dataset.k = 'txt' + n; continue; }

        m = k.match(/^em(\d{1,2})$/);                      // emoji réteg: emN, emNx/y/s/z/r
        if (m && p[k]) {
            const el = put(k + '-cont', 'txt'); el.dataset.k = k;
            el.textContent = String(p[k]).slice(0, 16);
            Object.assign(el.style, {
                left: U.num(pk(k + 'x'), -50, 150, 50) + '%', top: U.num(pk(k + 'y'), -50, 150, 50) + '%',
                fontSize: U.num(p[k + 's'], 1, 80, 12) + 'vmin', zIndex: U.num(p[k + 'z'], 0, 99, 15),
                transform: `translate(-50%,-50%) rotate(${U.num(p[k + 'r'], -360, 360, 0)}deg)`
            });
            continue;
        }
        m = k.match(/^(d\d{1,2})url$/);                     // képek: dNurl, dNx/y/w/h vagy dNs, dNr
        const u = m && U.cleanImageURL(p[k]);
        if (!u) continue;
        const b = m[1], el = put(b + '-cont', 'img'); el.dataset.k = b;
        let i = el.firstChild;
        if (!i) { i = new Image(); i.alt = ''; i.referrerPolicy = 'no-referrer'; el.appendChild(i); }
        if (i.getAttribute('src') !== u) i.src = u;
        T.apply(el, x => p[x], b, land);
        if (!p[b + 'w'] && !p[b + 'h']) { el.style.width = U.num(p[b + 's'], 1, 200, 40) + 'vw'; el.style.height = 'auto'; }
        else if (!p[b + 'h']) el.style.height = 'auto';
        el.style.zIndex = U.num(p[b + 'z'], 0, 99, 10);
        el.style.transform = `translate(-50%,-50%) rotate(${U.num(p[b + 'r'], -360, 360, 0)}deg)`;
    }
    els.forEach((el, id) => { if (!seen.has(id)) { el.remove(); els.delete(id); } });   // törölt elemek

    const thumb = p.thumb === '1';                       // sablon-miniatűr: nincs média, effekt és indítógomb
    const cfg = thumb ? null : mediaCfg(p), vc = $('v-cont');
    vc.style.display = (cfg && !cfg.audio) ? 'block' : 'none';
    vc.classList.toggle('yt', !!cfg && cfg.prov === 'youtube');
    vc.classList.toggle('ctl', !!cfg && cfg.ctl);
    if (cfg && !cfg.audio) T.apply(vc, x => p[x], 'v', land);
    vc.style.zIndex = U.num(p.vz, 0, 99, 0);
    go.textContent = String(p.btn || t('Indítás')).slice(0, 30);
    setMedia(cfg);
    document.body.classList.toggle('edit', p.edit === '1');
    document.body.classList.toggle('ro', land);                  // fekvő nézetben csak megtekintés, a szerkesztés az álló nézetben történik
    ov.style.display = (!document.body.classList.contains('edit') && media.cfg && !started && !EMB) ? 'flex' : 'none';   // szerkesztés közben ne takarja az indítógomb
    placeSel();
    fx(thumb ? 'none' : p.effect, U.hex(p.ec) || '#ffffff', U.num(p.intens, 1, 5, 2));
}

const FX = {
    snow: { s: 'dot', v: 1 }, bday: { s: 'rect', v: 1.5, rb: 1 }, rain: { s: 'line', v: 7 }, bubbles: { s: 'ring', v: -1 },
    hearts: { g: '❤️', v: -1 }, stars: { g: '⭐', v: 0, tw: 1 }, sparkles: { g: '✨', v: -.4, tw: 1 },
    leaves: { g: '🍂', v: 1 }, flowers: { g: '🌸', v: .8 }
};
function fx(type, color, k) {
    const key = type + color + k;
    if (key === fxKey) return;
    fxKey = key; cancelAnimationFrame(raf);
    const g = cv.getContext('2d'); cv.width = innerWidth; cv.height = innerHeight;
    g.clearRect(0, 0, cv.width, cv.height);
    const e = FX[type]; if (!e) return;
    const ps = Array.from({ length: 30 * k }, () => ({
        x: Math.random() * cv.width, y: Math.random() * cv.height, r: 3 + Math.random() * 6,
        v: .5 + Math.random() * 1.5, d: Math.random() * 6.28, h: Math.random() * 360
    }));
    (function loop() {
        g.clearRect(0, 0, cv.width, cv.height);
        for (const p of ps) {
            p.y += p.v * e.v; p.d += .02; if (e.s !== 'line') p.x += Math.sin(p.d) * .6;
            if (p.y > cv.height + 10) p.y = -10; else if (p.y < -10) p.y = cv.height + 10;
            g.globalAlpha = e.tw ? .4 + .6 * Math.abs(Math.sin(p.d * 3)) : 1;
            if (e.g) { g.font = `${p.r * 4}px serif`; g.fillText(e.g, p.x, p.y); continue; }
            g.fillStyle = g.strokeStyle = e.rb ? `hsl(${p.h},90%,60%)` : color;
            g.beginPath();
            if (e.s === 'rect') g.rect(p.x, p.y, p.r * 1.6, p.r * .8);
            else if (e.s === 'line') { g.moveTo(p.x, p.y); g.lineTo(p.x - 2, p.y + p.r * 2); }
            else if (e.s === 'ring') g.arc(p.x, p.y, p.r * 1.5, 0, 6.28);
            else g.arc(p.x, p.y, p.r * .6, 0, 6.28);
            (e.s === 'line' || e.s === 'ring') ? g.stroke() : g.fill();
        }
        g.globalAlpha = 1;
        raf = requestAnimationFrame(loop);
    })();
}

// --- Médiaforrások: csak hivatalos beágyazott lejátszók és saját fájl. Külső tartalom csak az Indítás gomb után töltődik be.
const MEDIA = {
    youtube: { parse: U.parseYouTubeID, name: 'YouTube (Google)' },
    tiktok: { parse: U.parseTikTokID, name: 'TikTok' },
    videa: { parse: U.parseVideaID, name: 'Videa' },
    file: { parse: U.parseMediaURL, name: '' }
};
function mediaCfg(p) {
    const prov = p.med || (p.yt ? 'youtube' : ''), d = MEDIA[prov];       // a régi yt= link is működik
    if (!d) return null;
    const id = d.parse(p.mid || p.yt || '');
    if (!id) return null;
    if (prov === 'file' && String(p.mjog) !== '1') return null;            // jogosultsági nyilatkozat nélkül nincs lejátszás
    const audio = prov === 'file' && (p.mmode === 'audio' || /\.(mp3|ogg|m4a|wav|aac)$/i.test(id));
    return { prov, id, audio, loop: p.mloop === '1', mute: p.mmute === '1', ctl: p.mctl === '1' };
}
let tick = 0;
function startTick() {                                                // az álló (hangos) előnézet időjelet küld, a fekvő ehhez igazodik
    clearInterval(tick); if (!EMB || isSlave()) return;
    tick = setInterval(() => {
        let tm, st;
        if (player && player.getCurrentTime) { tm = player.getCurrentTime(); st = player.getPlayerState(); }
        else if (fileEl && fileEl.tagName === 'VIDEO') { tm = fileEl.currentTime; st = fileEl.paused ? 2 : 1; }
        if (tm != null) up({ type: 'TICK', t: tm, s: st });
    }, 500);
}
function syncTo(tm, st) {
    if (!isSlave() || !(tm >= 0)) return;
    if (player && player.getCurrentTime && player.getPlayerState) {
        if (Math.abs(player.getCurrentTime() - tm) > 0.8) player.seekTo(tm, true);
        const cur = player.getPlayerState();
        if (st === 1 && cur !== 1 && cur !== 3) player.playVideo(); else if (st === 2 && cur === 1) player.pauseVideo();
    } else if (fileEl && fileEl.tagName === 'VIDEO') {
        if (Math.abs(fileEl.currentTime - tm) > 0.8) fileEl.currentTime = tm;
        if (st === 1 && fileEl.paused) fileEl.play().catch(() => { }); else if (st === 2 && !fileEl.paused) fileEl.pause();
    }
}
function stopMedia() {
    clearInterval(tick); tick = 0;
    try { player && player.destroy && player.destroy(); } catch { }
    if (fileEl) { fileEl.pause(); fileEl = null; }
    player = null; $('v-cont').innerHTML = '<div id="player"></div>';
}
function setMedia(cfg) {
    const key = JSON.stringify(cfg);
    if (key === media.key) return;
    media = { key, cfg }; stopMedia();
    const name = cfg && MEDIA[cfg.prov].name;
    $('note').textContent = name ? t('Az Indítás gombra kattintva a(z) {x} szolgáltatótól töltődik be tartalom, amely sütiket és adatokat (pl. IP-cím) kezelhet.', { x: name }) : '';
    ov.style.display = (cfg && !started && !EMB) ? 'flex' : 'none';     // az előnézetben az admin indít egyszerre mindkét nézetet
    if (cfg && started) startMedia();
}
function startMedia() {
    const c = media.cfg, box = $('v-cont');
    if (!c) return;
    const slave = isSlave();
    if (slave && (c.prov === 'tiktok' || c.prov === 'videa' || c.audio)) return;      // csak a szinkronizálható videót követi a fekvő nézet
    const frame = src => {
        const f = document.createElement('iframe');
        f.src = src; f.allow = 'autoplay; fullscreen; encrypted-media'; f.setAttribute('allowfullscreen', '');
        box.innerHTML = ''; box.appendChild(f);
    };
    if (c.prov === 'youtube') {
        const mk = () => {
            const pv = { autoplay: 1, controls: c.ctl ? 1 : 0, playsinline: 1, rel: 0, mute: (c.mute || slave) ? 1 : 0 };
            if (c.loop) { pv.loop = 1; pv.playlist = c.id; }
            player = new YT.Player('player', { host: 'https://www.youtube-nocookie.com', width: '100%', height: '100%', videoId: c.id, playerVars: pv, events: { onReady: e => { if (slave) e.target.mute(); e.target.playVideo(); startTick(); } } });
        };
        if (window.YT && YT.Player) mk();
        else {
            window.onYouTubeIframeAPIReady = mk;
            const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
        }
    } else if (c.prov === 'tiktok') frame(`https://www.tiktok.com/player/v1/${c.id}?autoplay=1&muted=${+c.mute}&loop=${+c.loop}&controls=${+c.ctl}`);
    else if (c.prov === 'videa') frame(`https://videa.hu/player?v=${c.id}&autoplay=1`);
    else if (c.prov === 'file') {
        const el = document.createElement(c.audio ? 'audio' : 'video');
        Object.assign(el, { src: c.id, loop: c.loop, muted: c.mute || slave, controls: c.ctl, playsInline: true });
        el.style.cssText = 'width:100%;height:100%;object-fit:contain';
        box.innerHTML = ''; box.appendChild(el); fileEl = el; el.play().catch(() => { }); startTick();
    }
}
go.addEventListener('click', () => { started = true; ov.style.display = 'none'; startMedia(); });   // felhasználói esemény: így indulhat a hang

addEventListener('message', e => {           // csak a szülő (admin) ablakból, azonos eredetről
    if (e.origin !== location.origin || e.source !== parent) return;
    const d = e.data || {};
    if (d.type === 'STYLE') render(d.params || {});
    if (d.type === 'START' && !started) { started = true; ov.style.display = 'none'; startMedia(); }
    if (d.type === 'SYNC') syncTo(d.t, d.s);
    if (d.type === 'SELECT') setSel(typeof d.key === 'string' ? d.key : null, false);
    if (d.type === 'VIDEO') {
        const pause = d.action === 'pause';
        if (player && player.playVideo) pause ? player.pauseVideo() : player.playVideo();
        if (fileEl) pause ? fileEl.pause() : fileEl.play().catch(() => { });
    }
});
addEventListener('resize', () => { fxKey = ''; render(last); });

// ---- Szerkesztő mód: kijelölés, mozgatás, átméretezés, forgatás (csak az álló nézetben)
const sel = $('sel'), rotH = document.createElement('b');
rotH.id = 'rot';
['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w'].forEach(h => { const i = document.createElement('i'); i.dataset.h = h; sel.appendChild(i); });
sel.appendChild(rotH);
let selKey = null, drag = null, pend = null, raf2 = 0;
const KEY_OK = /^(txt\d{1,2}|em\d{1,2}|d\d{1,2}|v)$/;
const up = m => { if (parent !== window) parent.postMessage(m, location.origin); };
const editOn = () => document.body.classList.contains('edit') && innerWidth <= innerHeight;
const elOf = k => (k && KEY_OK.test(k)) ? document.querySelector(`[data-k="${k}"]`) : null;
const rotOf = k => k === 'v' ? 0 : U.num(last[T.keyOf(k, 'r')], -360, 360, 0);

function placeSel() {
    const el = elOf(selKey);
    if (!el || el.style.display === 'none' || !editOn()) { sel.hidden = true; return; }
    const r = el.getBoundingClientRect(), text = !/^(d|v)/.test(selKey);
    Object.assign(sel.style, {
        left: r.left + r.width / 2 + 'px', top: r.top + r.height / 2 + 'px', width: el.offsetWidth + 'px', height: el.offsetHeight + 'px',
        transform: `translate(-50%,-50%) rotate(${rotOf(selKey)}deg)`
    });
    sel.querySelectorAll('i').forEach(i => { i.style.display = (text && i.dataset.h.length === 1) ? 'none' : ''; });   // szövegnél/emojinál csak a sarkok
    rotH.style.display = selKey === 'v' ? 'none' : '';
    sel.hidden = false;
}
function setSel(k, notify) { selKey = elOf(k) ? k : null; placeSel(); if (notify) up({ type: 'SELECT', key: selKey }); }
function patch(props) {                                 // azonnali helyi frissítés, a szülő (admin) mezői rAF-fel követik
    for (const [a, v] of Object.entries(props)) last[T.keyOf(selKey, a)] = String(Math.round(v * 10) / 10);
    pend = { key: selKey, props: { ...(pend && pend.key === selKey ? pend.props : {}), ...props } };
    render(last);
    if (!raf2) raf2 = requestAnimationFrame(() => { raf2 = 0; if (pend) up({ type: 'EDIT', key: pend.key, props: pend.props }); pend = null; });
}
document.addEventListener('pointerdown', e => {
    if (!editOn()) return;
    const t = e.target, h = t.dataset && t.dataset.h, isRot = t.id === 'rot', cur = elOf(selKey);
    if ((h || isRot) && cur) {
        const r = cur.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        drag = { mode: isRot ? 'rot' : 'size', h, cx, cy, d0: Math.hypot(e.clientX - cx, e.clientY - cy) || 1, s0: parseFloat(cur.style.fontSize) || 10 };
    } else {
        const el = t.closest && t.closest('.element[data-k]');
        if (!el) { setSel(null, true); return; }
        setSel(el.dataset.k, true);
        const r = el.getBoundingClientRect();
        drag = { mode: 'move', px: e.clientX, py: e.clientY, cx: r.left + r.width / 2, cy: r.top + r.height / 2 };
    }
    if (t.setPointerCapture) { try { t.setPointerCapture(e.pointerId); } catch { } }
    e.preventDefault();
});
document.addEventListener('pointermove', e => {
    if (!drag || !selKey) return;
    const k = selKey;
    if (drag.mode === 'move') patch({ x: (drag.cx + e.clientX - drag.px) / innerWidth * 100, y: (drag.cy + e.clientY - drag.py) / innerHeight * 100 });
    else if (drag.mode === 'rot') {
        let a = Math.atan2(e.clientY - drag.cy, e.clientX - drag.cx) * 180 / Math.PI + 90;
        if (a > 180) a -= 360;
        patch({ r: e.shiftKey ? Math.round(a / 15) * 15 : a });
    } else {
        const dx = e.clientX - drag.cx, dy = e.clientY - drag.cy;
        if (!/^(d|v)/.test(k)) { patch({ s: Math.max(1, Math.min(k.startsWith('em') ? 80 : 30, drag.s0 * Math.hypot(dx, dy) / drag.d0)) }); return; }
        const a = rotOf(k) * Math.PI / 180, lx = dx * Math.cos(a) + dy * Math.sin(a), ly = -dx * Math.sin(a) + dy * Math.cos(a), o = {};
        if (/[ew]/.test(drag.h)) o.w = Math.max(2, 2 * Math.abs(lx) / innerWidth * 100);
        if (/[ns]/.test(drag.h)) o.h = Math.max(2, 2 * Math.abs(ly) / innerHeight * 100);
        patch(o);
    }
});
['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, () => { drag = null; }));
addEventListener('keydown', e => {                      // a billentyűket a szülő (admin) dolgozza fel: másolás, kivágás, beillesztés, törlés, nyilak
    const ctrl = e.ctrlKey || e.metaKey;
    if (!editOn() || (!selKey && !ctrl)) return;
    if (/^(Delete|Backspace|Arrow(Up|Down|Left|Right))$/.test(e.key) || (ctrl && /^[cxv]$/i.test(e.key))) {
        e.preventDefault(); up({ type: 'KEY', key: e.key, ctrl, shift: e.shiftKey });
    }
});

if (!THUMB) { await loadLang(); document.title = t('Kártya'); }     // a miniatűröknek nem kell nyelvi fájl
render(last);
if (parent !== window && last.thumb !== '1') parent.postMessage({ type: 'READY' }, location.origin);
</script>
</body>
</html>
